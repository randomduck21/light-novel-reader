name: Build Firefox XPI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Upload XPI
        uses: actions/upload-artifact@v4
        with:
          name: light-novel-reader-xpi
          path: light-novel-reader.xpi
          if-no-files-found: error
