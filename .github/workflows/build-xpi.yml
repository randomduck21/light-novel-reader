name: Build Firefox XPI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inspect Piper bundle
        run: |
          node -e "const fs=require('fs'); const p='node_modules/@realtimex/piper-tts-web/dist/piper-tts-web.js'; const s=fs.readFileSync(p,'utf8'); for (const term of ['phoneme_ids','phonemeIds','speakerId','new Promise']) { const i=s.indexOf(term); console.log('TERM',term,'INDEX',i); if(i>=0) console.log(s.slice(Math.max(0,i-1200),i+2200)); }"

      - name: Build extension
        run: npm run build

      - name: Upload XPI
        uses: actions/upload-artifact@v4
        with:
          name: light-novel-reader-xpi
          path: light-novel-reader.xpi
          if-no-files-found: error
