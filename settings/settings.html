<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Light Novel Reader Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>Light Novel Reader</h1>
    <label>
      Default voice ID
      <input id="voice" value="en_US-lessac-medium" spellcheck="false">
    </label>
    <label>
      Pre-buffer chunks
      <input id="prebuffer" type="number" min="1" max="4" value="3">
    </label>
    <button id="save">Save settings</button>
    <div id="status"></div>
  </main>
  <script src="settings.js" type="module"></script>
</body>
</html>
