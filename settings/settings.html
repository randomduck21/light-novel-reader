<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Novel Reader Settings</title><link rel="stylesheet" href="settings.css"></head><body><main><div class="eyebrow">LIGHT NOVEL READER</div><h1>Reader settings</h1><p class="intro">Choose a neural voice and defaults for the in-page reader.</p><section class="card"><label for="voiceSearch">Voice</label><input id="voiceSearch" type="search" placeholder="Search voices: Alan, lessac, UK..."><select id="voice" size="10"></select><div class="selected">Selected: <code id="selectedVoice"></code></div></section><section class="card"><label for="prebuffer">Pre-buffer sentences</label><input id="prebuffer" type="range" min="1" max="4" step="1" value="3"><div id="prebufferValue">3 sentences</div></section><button id="save">Save settings</button><div id="status"></div></main><script src="../tts/voices.js"></script><script src="settings.js"></script></body></html>
